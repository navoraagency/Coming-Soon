<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The new home of Navora Agency is coming soon.">
    <title>Navora Agency | Coming Soon</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #101619;
            --text: #f3f2eb;
            --accent: #ff804a;
            --muted: #b1babc;
            --line: #364044;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: min(90%, 1440px);
            min-height: 100svh;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        header,
        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.5rem 0;
        }

        header {
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .mark {
            width: 2rem;
            height: 2rem;
            background: var(--accent);
            clip-path: polygon(0 100%, 0 0, 24% 0, 76% 60%, 76% 0,
                    100% 0, 100% 100%, 76% 100%, 24% 40%, 24% 100%);
        }

        .status,
        footer {
            color: var(--muted);
            font: 0.7rem/1.5 monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .status::before {
            content: "";
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            margin-right: 0.5rem;
            border-radius: 50%;
            background: var(--accent);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 2rem;
            padding: 3rem 0;
        }

        h1 {
            margin: 0;
            font-size: clamp(5rem, 10vw, 10rem);
            line-height: 0.88;
            letter-spacing: -0.08em;
        }

        h1 span {
            color: var(--accent);
        }

        p {
            max-width: 31ch;
            margin: 2rem 0 0;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .art {
            display: block;
            width: 100%;
            max-height: 60vh;
            background-image:
                linear-gradient(#ffffff08 1px, transparent 1px),
                linear-gradient(90deg, #ffffff08 1px, transparent 1px);
            background-size: 10% 10%;
        }

        footer {
            border-top: 1px solid var(--line);
        }

        @media (max-width: 700px) {
            main {
                grid-template-columns: 1fr;
            }

            .art {
                max-height: 32svh;
            }

            h1 {
                font-size: clamp(4.5rem, 18vw, 7rem);
            }

            p {
                margin-top: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <div class="brand"><span class="mark" aria-hidden="true"></span>Navora Agency</div>
            <span class="status">Pre-launch</span>
        </header>

        <main>
            <section>
                <h1>Coming<br>soon<span>.</span></h1>
                <p>We’re shaping the new home of Navora Agency. See you here soon.</p>
            </section>

            <svg class="art" viewBox="0 0 400 400" aria-hidden="true">
                <defs>
                    <g id="orbit" fill="none" stroke="#ff804a" stroke-width="1.4">
                        <ellipse cx="200" cy="200" rx="155" ry="65" />
                    </g>
                    <g id="fan">
                        <use href="#orbit" />
                        <use href="#orbit" transform="rotate(5 200 200)" />
                        <use href="#orbit" transform="rotate(10 200 200)" />
                        <use href="#orbit" transform="rotate(15 200 200)" />
                        <use href="#orbit" transform="rotate(20 200 200)" />
                        <use href="#orbit" transform="rotate(25 200 200)" />
                    </g>
                </defs>
                <use href="#fan" />
                <use href="#fan" transform="rotate(30 200 200)" />
                <use href="#fan" transform="rotate(60 200 200)" />
                <use href="#fan" transform="rotate(90 200 200)" />
                <use href="#fan" transform="rotate(120 200 200)" />
                <use href="#fan" transform="rotate(150 200 200)" />
            </svg>
        </main>

        <footer>© Navora Agency</footer>
    </div>
</body>

</html>
